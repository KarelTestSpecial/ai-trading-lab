name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run guardrail tests
        run: uv run --group dev pytest -q
      - name: Lint
        run: uv run --group dev ruff check .
